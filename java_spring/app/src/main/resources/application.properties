server.port=8080

spring.datasource.url=jdbc:postgresql://db:5432/contacts_db
spring.datasource.username=user
spring.datasource.password=password

# The schema is created by postgresql/schema.sql via the postgres init hook.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# The API speaks snake_case: external_id, phone_number, date_created, date_updated.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
